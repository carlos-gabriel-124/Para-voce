<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Onde oficializamos tudo ♡
  </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
* {
    box-sizing:border-box
}

html {
    scroll-behavior:smooth
}

body {
    margin:0;
    min-height:100vh;
    background:radial-gradient(ellipse at top,#35101c,#10080d 68%);
    color:#f8dbe5;
    font-family:Poppins,sans-serif;
    overflow-x:hidden
}

.petal {
    position:fixed;
    top:-30px;
    color:#e6375e;
    z-index:0;
    pointer-events:none;
    animation:fall linear forwards;
    text-shadow:0 0 12px #f33b5d66
}

@keyframes fall {
to {
    transform:translateY(110vh) rotate(700deg);
    opacity:0
}

}

header {
    position:relative;
    z-index:1;
    text-align:center;
    padding:18px 15px
}

.brand {
    font:2.5rem 'Great Vibes',cursive;
    color:#ff8da8;
    margin:5px
}

.nav {
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap
}

.nav a,.btn {
    display:inline-block;
    color:#ffe4ec;
    text-decoration:none;
    border:1px solid #b74a64;
    background:#32131f;
    padding:10px 17px;
    border-radius:30px;
    cursor:pointer;
    font:inherit
}

.wrap {
    position:relative;
    z-index:1;
    max-width:820px;
    margin:15px auto 60px;
    padding:0 18px
}

.title {
    text-align:center;
    font:italic clamp(2rem,5vw,3.3rem) 'Playfair Display',serif;
    color:#ff9bb2
}

.paper {
    background:linear-gradient(135deg,#fff6f0,#f7e1d8);
    color:#4d1e2e;
    padding:clamp(25px,6vw,58px);
    border-radius:8px 8px 25px 8px;
    box-shadow:0 0 0 1px #e7b4b0,0 20px 80px #0008;
    min-height:300px;
    position:relative
}

.paper:before {
    content:'♡';
    position:absolute;
    top:10px;
    right:17px;
    color:#b64c65;
    font-size:1.6rem
}

.letter {
    white-space:pre-wrap;
    font:italic clamp(1.25rem,3vw,1.7rem)/1.85 'Great Vibes',cursive;
    min-height:210px
}

.controls {
    display:flex;
    gap:12px;
    justify-content:center;
    flex-wrap:wrap;
    margin:25px 0
}

.btn:hover,.nav a:hover {
    background:#8d2441
}

.music-note {
    text-align:center;
    color:#e8a3b4;
    font-size:.88rem
}

.hidden {
    display:none!important
}
  </style>
 </head>
 <body>
  <header>
    <nav class="nav" aria-label="Navegação principal">
     <a href="historia.html">Nossa história</a>
     <a href="declaracao.html">Declaração</a>
    </nav>
   </header>
  <main class="wrap">
   <h1 class="title">
    Onde oficializamos tudo: ♡
   </h1>
   <div class="paper">
    <div class="letter" id="letter">
    </div>
   </div>
   <div class="controls">
    <button class="btn" id="musicBtn">
     ♫ Tocar nossa m&uacute;sica
    </button>
    <button class="btn" id="replay">
     Ler a carta novamente
    </button>
   </div>
   <p class="music-note">

   </p>
   <audio id="music" loop="" preload="none" src="musica.mp3">
   </audio>
  </main>
  <script>
   function petala(){const p=document.createElement('span');p.className='petal';p.textContent=['✿','❀','♥'][Math.floor(Math.random()*3)];p.style.left=Math.random()*100+'vw';p.style.fontSize=(13+Math.random()*19)+'px';p.style.animationDuration=(7+Math.random()*8)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),16000)}setInterval(petala,420);const texto=`Meu amor, Emilayle…\n\nAqui, neste pequeno pedaço do nosso mundo, eu queria deixar registrado algo que o meu coração repete de tantas maneiras: eu sou grato a Deus pela nossa história e pelo privilégio de amar você. A nossa data não é apenas um número no calendário. É uma lembrança do começo de algo que passou a ter um lugar muito especial dentro de mim.\n\nQuando penso em tudo o que ainda desejo viver com você, não peço uma caminhada sem desafios. Peço que Deus caminhe conosco. Que Ele seja o fundamento das nossas escolhas, a calma quando vier a ansiedade, a sabedoria quando precisarmos decidir e o amor que nos ensine a tratar um ao outro com respeito, paciência e verdade.\n\nQuero continuar escolhendo você nas pequenas coisas. Quero cuidar do que estamos construindo, proteger a confiança que existe entre nós e nunca achar que o amor dispensa atenção. Quero aprender a te ouvir melhor, celebrar aquilo que faz seus olhos brilharem, segurar sua mão quando o dia for pesado e estar presente de verdade, não apenas de palavras.\n\nSonho com o nosso futuro: com os planos que vamos tirar do papel, com as risadas que ainda vão ecoar, com a nossa casa cheia de paz, com as orações que faremos e com a alegria de olhar para trás e perceber o quanto crescemos. Quero que o nosso relacionamento seja um lugar de segurança, amizade, companheirismo e fé. Que a gente nunca deixe o orgulho vencer o diálogo, nem a rotina apagar a ternura.\n\nEu não prometo ser perfeito. Prometo levar a sério o compromisso de crescer, reconhecer meus erros e buscar ser alguém que faça bem à sua vida. Quero que minhas atitudes acompanhem minhas palavras e que você encontre em mim respeito, honestidade, carinho e disposição para construir. O amor que desejo para nós não é só bonito quando tudo dá certo; é firme o suficiente para enfrentar as fases difíceis sem esquecer a gentileza.\n\nObrigado por ser você. Obrigado por fazer parte dos meus pensamentos, dos meus sonhos e das minhas orações. Se eu pudesse guardar uma certeza para os dias que virão, seria esta: quero viver o que ainda nos espera com o coração aberto, os pés no chão e Deus à frente de cada passo.\n\nQue Ele abençoe nossa data, nossa história e cada capítulo que ainda será escrito. Que nunca nos falte fé para confiar, humildade para aprender e amor para continuar. E quando a vida nos der motivos para sorrir, que a gente celebre junto; quando nos desafiar, que a gente se lembre de que somos parceiros e que não precisamos enfrentar tudo sozinhos.\n\nEu te amo, Emilayle. Com sinceridade, com intenção e com a esperança de que nosso amor continue florescendo sob o cuidado de Deus. Hoje e em cada dia que Ele nos permitir viver. ❤️`;const el=document.getElementById('letter');let timer;function escrever(){clearTimeout(timer);el.textContent='';let i=0;function passo(){if(i<texto.length){el.textContent+=texto[i++];timer=setTimeout(passo,texto[i-1]==='\n'?350:75)}}passo()}escrever();const music=document.getElementById('music'),btn=document.getElementById('musicBtn');btn.onclick=async()=>{if(music.paused){try{await music.play();btn.textContent='Ⅱ Pausar nossa música'}catch(e){alert('Não consegui tocar a música. Confira se musica.mp3 está na mesma pasta e tente novamente.')}}else{music.pause();btn.textContent='♫ Tocar nossa música'}};document.getElementById('replay').onclick=escrever;
  </script>
 </body>
</html>
