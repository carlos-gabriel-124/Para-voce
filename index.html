<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe4ef">
  <title>Eu te amo, Emilayle ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --pink:#d93679; --ink:#4b2438; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; display:grid; place-items:center; padding:24px; color:var(--ink); font-family:'Poppins',sans-serif; background:linear-gradient(135deg,#ffe4ef,#fff5f8 55%,#ffd8e8); }
    .intro { position:fixed; inset:0; z-index:5; display:grid; place-items:center; background:#fff0f6; transition:opacity .9s,visibility .9s; }
    .intro.hide { opacity:0; visibility:hidden; }
    .intro-heart { color:var(--pink); font-size:clamp(100px,25vw,190px); animation:pulse 1s infinite; filter:drop-shadow(0 12px 24px #d9367950); }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }
    .petal { position:fixed; top:-35px; z-index:0; pointer-events:none; color:#e66b9b; opacity:.75; animation:fall linear forwards; }
    @keyframes fall { to { transform:translateY(110vh) rotate(650deg); opacity:0; } }
    .page { position:relative; z-index:1; width:min(100%,520px); text-align:center; animation:appear 1.1s ease both; }
    @keyframes appear { from{opacity:0;transform:translateY(18px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    .brand { margin:0 0 22px; color:var(--pink); font:italic clamp(2.2rem,8vw,3.4rem) 'Great Vibes',cursive; }
    .heart-photo { width:min(75vw,340px); margin:0 auto 25px; filter:drop-shadow(0 20px 25px #a02b5c35); }
    .heart-photo svg { display:block; width:100%; height:auto; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .access { padding:25px clamp(18px,5vw,32px) 30px; background:#ffffffc9; border:1px solid #f1bdd2; border-radius:28px; box-shadow:0 20px 60px #9c42651a; backdrop-filter:blur(8px); }
    .access h1 { margin:0 0 9px; color:#b92d68; font:italic 1.8rem 'Playfair Display',serif; }
    .access p { margin:0 0 18px; font-size:.95rem; line-height:1.7; }
    input { width:100%; padding:14px 16px; border:1px solid #e6a8c3; border-radius:13px; background:white; font:inherit; text-align:center; letter-spacing:.15em; outline-color:var(--pink); }
    button { margin-top:13px; border:0; border-radius:999px; padding:13px 23px; background:var(--pink); color:#fff; font:inherit; cursor:pointer; box-shadow:0 8px 20px #d9367930; transition:transform .2s,background .2s; }
    button:hover { background:#b92d68; transform:translateY(-2px); }
    @media(max-height:700px) { body{overflow:auto}.heart-photo{width:min(55vw,250px)}.brand{margin-bottom:10px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important} }
  </style>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true"><div class="intro-heart">♥</div></div>
  <main class="page">
    <p class="brand">Eu te amo Emilayle</p>
    <div class="heart-photo">
      <svg viewBox="0 0 512 512" role="img" aria-label="Nossa foto em formato de coração">
        <defs><clipPath id="heartClip"><path d="M256 462 C220 427 42 308 42 166 C42 58 178 28 256 130 C334 28 470 58 470 166 C470 308 292 427 256 462Z"/></clipPath></defs>
        <image href="principal.jpg" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)"/>
        <path d="M256 462 C220 427 42 308 42 166 C42 58 178 28 256 130 C334 28 470 58 470 166 C470 308 292 427 256 462Z" fill="none" stroke="#fff" stroke-width="8"/>
      </svg>
    </div>
    <form class="access" id="formAcesso">
      <h1>Acessar nossa vida</h1>
      <p>Nosso cantinho tem uma senha especial. ❤️</p>
      <label for="senhaPrincipal" class="sr-only">Senha de acesso</label>
      <input id="senhaPrincipal" name="senha" type="password" inputmode="numeric" autocomplete="off" placeholder="Digite nossa senha" required>
      <button type="submit">Acessar nossa vida ♡</button>
    </form>
  </main>
  <script>
    'use strict';
    const SENHA_SITE = '280626';
    const intro = document.getElementById('intro');
    window.setTimeout(() => intro.classList.add('hide'), 1500);
    function criarPetala() {
      const petala = document.createElement('span');
      petala.className = 'petal';
      petala.textContent = ['✿', '❀', '♥'][Math.floor(Math.random() * 3)];
      petala.style.left = `${Math.random() * 100}vw`;
      petala.style.fontSize = `${12 + Math.random() * 18}px`;
      petala.style.animationDuration = `${7 + Math.random() * 8}s`;
      document.body.appendChild(petala);
      window.setTimeout(() => petala.remove(), 16000);
    }
    window.setInterval(criarPetala, 550);
    document.getElementById('formAcesso').addEventListener('submit', event => {
      event.preventDefault();
      const senha = document.getElementById('senhaPrincipal').value;
      if (senha === SENHA_SITE) {
        window.location.href = 'historia.html';
      } else {
        window.alert('Quando é Deus quem cuida, ninguém de fora acessa');
        document.getElementById('senhaPrincipal').select();
      }
    });
  </script>
</body>
</html>
