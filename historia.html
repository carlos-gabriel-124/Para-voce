<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffe4ef">
  <title>Nós — Eu te amo, Emilayle ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--pink:#d93679;--rose:#f6b5cf;--cream:#fff7fa;--ink:#4b2438}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:linear-gradient(135deg,#fff5f8,#ffe4ef);color:var(--ink);font-family:Poppins,sans-serif;min-height:100vh}
    header{position:sticky;top:0;z-index:4;padding:16px 18px 14px;text-align:center;background:#fff7faeF;backdrop-filter:blur(12px);border-bottom:1px solid #f1c6d8}
    .brand{font:italic clamp(2rem,5vw,2.8rem) 'Great Vibes',cursive;color:var(--pink);margin:0 0 12px}
    nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    nav a{font-size:.9rem;color:#853b60;text-decoration:none;background:#fff;border:1px solid #efb6ce;border-radius:999px;padding:9px 19px;transition:.2s;box-shadow:0 4px 14px #9c42650d}
    nav a:hover{background:var(--pink);color:white}
    main{width:min(1100px,100%);margin:auto;padding:36px 20px 60px}
    .intro{text-align:center;margin:10px auto 38px;max-width:700px}
    h1,h2{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;color:#b92d68}
    h1{font-size:clamp(2.3rem,5vw,3.5rem);margin:0 0 12px}
    .intro p{line-height:1.8;margin:0}
    .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
    .photo{border:0;background:white;padding:7px;border-radius:18px;box-shadow:0 8px 25px #8f34541c;cursor:zoom-in;transition:transform .25s;min-width:0}
    .photo:hover{transform:translateY(-4px) rotate(-.5deg)}
    .photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px}
    .photo span{display:block;padding:9px 3px 4px;font:italic 1rem 'Playfair Display',serif}
    .links{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:42px auto}
    .primary{display:inline-block;padding:13px 22px;border-radius:999px;background:var(--pink);color:#fff;text-decoration:none;border:0;font:inherit;cursor:pointer;box-shadow:0 8px 20px #d9367930}
    .letter-gate{max-width:500px;margin:45px auto 0;padding:28px;background:#ffffffc9;border:1px solid #f1bdd2;border-radius:25px;text-align:center;box-shadow:0 20px 60px #9c42651a}
    .letter-gate h2{font-size:2rem;margin:0 0 12px}
    .letter-gate p{line-height:1.7}
    .letter-gate input{width:100%;padding:13px;border:1px solid #e6a8c3;border-radius:12px;font:inherit;text-align:center}
    .lightbox{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;gap:20px;padding:60px 18px;background:#160b12ed}
    .lightbox.open{display:flex}
    .lightbox img{max-width:min(75vw,850px);max-height:82vh;object-fit:contain;border-radius:8px;cursor:zoom-in;transition:transform .25s}
    .lightbox button{position:absolute;border:0;border-radius:50%;width:44px;height:44px;background:#ffffff25;color:white;font-size:1.8rem;cursor:pointer}
    .lightbox .close{top:18px;right:20px}.lightbox .prev{left:18px;top:50%}.lightbox .next{right:18px;top:50%}
    footer{text-align:center;padding:20px;color:#9b6b82;font:italic 1.1rem 'Great Vibes',cursive;font-size:1.7rem}
    @media(max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}main{padding:28px 13px}.lightbox img{max-width:80vw}.lightbox .prev{left:5px}.lightbox .next{right:5px}}
    @media(max-width:420px){.gallery{grid-template-columns:1fr 1fr}.photo span{font-size:.9rem}nav{gap:6px}nav a{padding:8px 12px;font-size:.82rem}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header>
    <p class="brand">Eu te amo Emilayle</p>
    <nav aria-label="Navegação principal">
      <a href="historia.html" aria-current="page">Nossa história</a>
      <a href="declaracao.html">Declaração</a>
      <a href="#carta">Carta</a>
    </nav>
  </header>
  <main>
    <section class="intro">
      <h1>Nossos momentos ♡</h1>
      <p>Cada foto guarda um pedacinho da nossa história. Toque em uma imagem para reviver essa lembrança.</p>
    </section>
    <section class="gallery" id="gallery" aria-label="Galeria de nossas fotos"></section>
    <div class="links"><a class="primary" href="declaracao.html">Para você, meu amor ♡</a></div>
    <section class="letter-gate" id="carta">
      <h2>Onde oficializamos tudo:</h2>
      <p>Digite a senha especial para abrir a nossa carta.</p>
      <form id="formCarta">
        <input id="senhaCarta" type="password" placeholder="Senha da carta" aria-label="Senha da carta" autocomplete="off" required>
        <button class="primary" type="submit">Abrir nossa carta 💌</button>
      </form>
    </section>
  </main>
  <footer>Com amor, para nós dois. ♡</footer>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Visualização da foto">
    <button class="close" type="button" aria-label="Fechar">×</button>
    <button class="prev" type="button" aria-label="Foto anterior">‹</button>
    <img id="fotoGrande" alt="Nossa lembrança ampliada">
    <button class="next" type="button" aria-label="Próxima foto">›</button>
  </div>
  <script>
    'use strict';
    const SENHA_CARTA = '020726';
    const fotos = Array.from({length:15}, (_, indice) => `foto${indice + 1}.jpg`);
    const galeria = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const fotoGrande = document.getElementById('fotoGrande');
    let fotoAtual = 0;
    let ampliada = false;

    fotos.forEach((src, indice) => {
      const botao = document.createElement('button');
      botao.type = 'button';
      botao.className = 'photo';
      botao.setAttribute('aria-label', `Abrir foto ${indice + 1}`);
      const imagem = document.createElement('img');
      imagem.src = src;
      imagem.alt = `Nossa foto ${indice + 1}`;
      imagem.loading = 'lazy';
      const legenda = document.createElement('span');
      legenda.textContent = 'Uma lembrança nossa ♡';
      botao.append(imagem, legenda);
      botao.addEventListener('click', () => abrirFoto(indice));
      galeria.appendChild(botao);
    });

    function abrirFoto(indice) {
      fotoAtual = indice;
      atualizarFoto();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function atualizarFoto() {
      fotoGrande.src = fotos[fotoAtual];
      fotoGrande.style.transform = 'scale(1)';
      fotoGrande.style.cursor = 'zoom-in';
      ampliada = false;
    }
    function trocarFoto(direcao) {
      fotoAtual = (fotoAtual + direcao + fotos.length) % fotos.length;
      atualizarFoto();
    }
    function fecharFoto() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }
    document.querySelector('.close').addEventListener('click', fecharFoto);
    document.querySelector('.prev').addEventListener('click', () => trocarFoto(-1));
    document.querySelector('.next').addEventListener('click', () => trocarFoto(1));
    fotoGrande.addEventListener('click', () => {
      ampliada = !ampliada;
      fotoGrande.style.transform = ampliada ? 'scale(1.5)' : 'scale(1)';
      fotoGrande.style.cursor = ampliada ? 'zoom-out' : 'zoom-in';
    });
    lightbox.addEventListener('click', event => { if (event.target === lightbox) fecharFoto(); });
    document.addEventListener('keydown', event => {
      if (!lightbox.classList.contains('open')) return;
      if (event.key === 'Escape') fecharFoto();
      if (event.key === 'ArrowRight') trocarFoto(1);
      if (event.key === 'ArrowLeft') trocarFoto(-1);
    });
    document.getElementById('formCarta').addEventListener('submit', event => {
      event.preventDefault();
      if (document.getElementById('senhaCarta').value === SENHA_CARTA) {
        window.location.href = 'carta-secreta.html';
      } else {
        window.alert('Essa carta é só para quem guarda nossa história no coração. ❤️');
        document.getElementById('senhaCarta').select();
      }
    });
  </script>
</body>
</html>
